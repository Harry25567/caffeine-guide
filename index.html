<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caffeine Info Guide</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              bg: '#090d16',
              card: 'rgba(15, 23, 42, 0.75)',
              accent: '#38bdf8',
              purple: '#8b5cf6',
              text: '#f8fafc',
              subtext: '#94a3b8',
              border: '#1e293b'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #070a12;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.5) 0%, transparent 100%);
      background-attachment: fixed;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: all 0.25s ease;
    }

    .glass-card:hover {
      background: rgba(20, 30, 55, 0.85);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .glass-card.expanded {
      background: rgba(15, 23, 42, 0.95);
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 25px -5px rgba(56, 189, 248, 0.25);
    }

    .expandable-content {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s ease, opacity 0.25s ease;
      opacity: 0;
    }

    .glass-card.expanded .expandable-content {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .expandable-inner {
      overflow: hidden;
    }

    .chevron-icon {
      transition: transform 0.3s ease;
    }
    .glass-card.expanded .chevron-icon {
      transform: rotate(180deg);
    }
  </style>
</head>
<body class="min-h-screen text-brand-text flex flex-col justify-between items-center px-4 py-8 md:py-12 relative overflow-x-hidden font-sans">

  <!-- Main Container -->
  <div class="max-w-5xl w-full mx-auto relative z-10">

    <!-- Header Section -->
    <header class="text-center mb-10">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full glass-card border border-emerald-500/30 text-xs font-semibold tracking-wider text-emerald-400 uppercase mb-4">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        Legal Drug in NZ
      </div>
      <h1 class="font-display text-4xl md:text-6xl font-extrabold tracking-tight text-white mb-6">
        Caffeine & <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">Your Brain</span>
      </h1>

      <!-- Pictures Section -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl mx-auto mt-6">
        <div class="glass-card rounded-2xl p-2">
          <img src="caffeine1.jpg" alt="Caffeine Chemical Structure" class="w-full h-44 object-cover rounded-xl bg-slate-800">
        </div>
        <div class="glass-card rounded-2xl p-2">
          <img src="caffeine2.jpg" alt="Coffee Beans and Structure" class="w-full h-44 object-cover rounded-xl bg-slate-800">
        </div>
      </div>
    </header>

    <!-- Cards Grid -->
    <main id="cards-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5 items-start">
      <!-- Cards populated by JS -->
    </main>
  </div>

  <!-- Footer -->
  <footer class="mt-14 text-center text-xs text-brand-subtext">
    <p>Health Studies — Caffeine Research</p>
  </footer>

  <!-- Data & Interaction Scripts -->
  <script>
    const cardsData = [
      {
        tag: "01",
        icon: "fa-brain",
        title: "What does it do to your body/brain?",
        content: `<p>Caffeine is a stimulant that affects the central nervous system. It helps you feel more awake, alert, and focused by blocking chemicals in the brain that make you feel tired. It can also increase heart rate and energy levels.</p>`
      },
      {
        tag: "02",
        icon: "fa-bolt",
        title: "Why do people take/use this drug?",
        content: `<p>People use caffeine to stay awake, improve concentration, increase energy, reduce tiredness, and improve performance in school, sport, or work.</p>`
      },
      {
        tag: "03",
        icon: "fa-triangle-exclamation",
        title: "What are the side effects/risks of taking the drug?",
        content: `<p>Having too much caffeine can cause shaking, headaches, dizziness, a fast heartbeat, and stomach aches. It also makes it hard to sleep and can cause headaches and crankiness if you suddenly stop having it.</p>`
      },
      {
        tag: "04",
        icon: "fa-heart-pulse",
        title: "How does it affect a person's well-being?",
        content: `
          <ul class="list-disc pl-5 space-y-1.5 text-slate-200">
            <li><strong class="text-cyan-300">Physical:</strong> Too much hurts your sleep, upsets your stomach, and makes your heart race.</li>
            <li><strong class="text-cyan-300">Mental/Emotional:</strong> It can make you feel anxious, stressed, and irritable.</li>
            <li><strong class="text-cyan-300">Social:</strong> Feeling cranky or tired from caffeine can cause arguments with friends and family.</li>
            <li><strong class="text-cyan-300">Spiritual:</strong> Relying on drinks for energy stops you from listening to your body when it needs real rest.</li>
          </ul>`
      },
      {
        tag: "05",
        icon: "fa-users",
        title: "What harm can this drug cause to others?",
        content: `<p>If a pregnant person drinks too much caffeine, it can harm their unborn baby. Heavy use can also make someone snappy and impatient with family, friends, or teammates.</p>`
      },
      {
        tag: "06",
        icon: "fa-scale-balanced",
        title: "What are the laws and punishments around the drug in NZ?",
        content: `<p>Caffeine is legal in New Zealand, so there are no criminal punishments for buying normal drinks. However, energy drinks have strict caffeine limits, pure caffeine powder is banned because it is deadly, and major supermarkets ban selling energy drinks to anyone under 16.</p>`
      },
      {
        tag: "07",
        icon: "fa-dollar-sign",
        title: "How much does it cost?",
        content: `<p>An energy drink or fizzy drink usually costs <strong>$2.50 to $5.00</strong>, and a café coffee costs about <strong>$5.00 to $7.00</strong>. Buying one every school day can easily cost over <strong>$800 a year</strong>.</p>`
      },
      {
        tag: "08",
        icon: "fa-hand",
        title: "How might you say no to this drug?",
        content: `<p>You can say, "No thanks, I want to sleep well tonight," or "I'm good, I'm just sticking to water today."</p>`
      },
      {
        tag: "09",
        icon: "fa-phone",
        title: "Where could someone get help if they need it?",
        content: `
          <ul class="list-disc pl-5 space-y-1.5 text-slate-200">
            <li><strong class="text-cyan-300">Youthline:</strong> Call 0800 376 633 or text 234.</li>
            <li><strong class="text-cyan-300">Alcohol Drug Helpline:</strong> Call 0800 787 984 or text 8681.</li>
            <li><strong class="text-cyan-300">Healthline:</strong> Call 0800 611 116.</li>
            <li><strong class="text-cyan-300">At school:</strong> Talk to a school counsellor, nurse, or trusted teacher.</li>
          </ul>`
      },
      {
        tag: "10",
        icon: "fa-lightbulb",
        title: "What surprised you while researching this drug?",
        content: `<p>I was surprised that pure caffeine powder is banned in New Zealand because just one teaspoon is equal to about 25 to 50 cups of coffee and can be fatal.</p>`
      },
      {
        tag: "11",
        icon: "fa-shield-heart",
        title: "What advice would you give to someone thinking about trying it?",
        content: `<p>Avoid energy drinks while you are still growing, stick to small amounts, and do not drink caffeine in the afternoon or night so it does not ruin your sleep.</p>`
      }
    ];

    const gridContainer = document.getElementById('cards-grid');

    cardsData.forEach((item, index) => {
      const cardEl = document.createElement('div');
      // Make the 11th (last) card span full width on medium+ screens so the grid is even
      const spanClass = index === cardsData.length - 1 ? 'md:col-span-2' : '';
      
      cardEl.className = `glass-card group rounded-2xl p-5 cursor-pointer relative overflow-hidden select-none ${spanClass}`;
      cardEl.onclick = () => cardEl.classList.toggle('expanded');

      cardEl.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-bold font-display text-cyan-400 tracking-wider">${item.tag}</span>
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400">
              <i class="fa-solid ${item.icon} text-xs"></i>
            </div>
            <div class="w-7 h-7 rounded-full bg-slate-800/60 flex items-center justify-center text-slate-400 chevron-icon">
              <i class="fa-solid fa-chevron-down text-xs"></i>
            </div>
          </div>
        </div>
        
        <h3 class="font-display text-base md:text-lg font-bold text-white group-hover:text-cyan-300 transition-colors">
          ${item.title}
        </h3>

        <div class="expandable-content">
          <div class="expandable-inner pt-3.5 mt-3.5 border-t border-slate-800/80 text-slate-200 text-sm leading-relaxed">
            ${item.content}
          </div>
        </div>
      `;

      gridContainer.appendChild(cardEl);
    });
  </script>
</body>
</html>
